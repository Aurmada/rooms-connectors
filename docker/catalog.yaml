# Docker MCP Toolkit custom catalog entry (remote server, no image to pull)
# docker mcp catalog create rooms-catalog
# docker mcp catalog add rooms-catalog rooms ./docker/catalog.yaml
name: rooms-catalog
displayName: Rooms by Aurmada
registry:
  rooms:
    description: Shared rooms where people and their AIs work together in one thread.
    title: Rooms by Aurmada
    type: remote
    remote:
      transport_type: streamable-http
      url: https://rooms.aurmada.com/mcp
    oauth:
      - provider: rooms
        url: https://rooms.aurmada.com
    homepage: https://rooms.aurmada.com/?utm_source=docker
    tags: [collaboration, multiplayer, teams, mcp]
